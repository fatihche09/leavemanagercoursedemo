# scripts/check.conf — the steps behind ./scripts/check (format: scripts/check.conf.example).
# Planned at bootstrap 2026-11-07, activated by spec 0001 (walking skeleton).
# Locally run check/doctor with dash: macOS /bin/sh cannot parse them (specs/backlog.md, B-1).
#
# --- Prerequisites (R-13) ---
requires backend-build: dotnet --version | grep -q '^10\.'
requires frontend-install: node -e "process.exit(+process.versions.node.split('.')[0] >= 24 ? 0 : 1)"
requires backend-integration: docker info > /dev/null 2>&1
#
# --- Backend (.NET 10) ---
# resource hygiene: no build server (MSBuild node reuse, VBCSCompiler, Razor)
backend-build [fast]: dotnet build LeaveManager.slnx -c Release --disable-build-servers -p:UseSharedCompilation=false -nodeReuse:false
backend-format [fast]: dotnet format LeaveManager.slnx --verify-no-changes --no-restore
# selector split (docs/testing.md rule 4): fast = NOT Integration, full-only = Integration — union = every test.
# xUnit v3 / MTP (docs/conventions.md, Known traps): a module the filter leaves empty exits 8, so 8 is
# ignored per module — and the step then fails itself unless the run's total is at least 1 test.
backend-unit [fast]: sh -c 'out=$(DOTNET_CLI_UI_LANGUAGE=en dotnet test --solution LeaveManager.slnx -c Release --no-build --filter-not-trait "Category=Integration" --ignore-exit-code 8 2>&1); rc=$?; printf "%s\n" "$out"; [ $rc -eq 0 ] || exit $rc; printf "%s\n" "$out" | grep -Eq "^ +total: [1-9]" || { echo "backend-unit: no tests ran"; exit 1; }'
# resource hygiene: each test disposes its PostgreSQL container; Ryuk reaps leftovers of a killed run
backend-integration: sh -c 'out=$(DOTNET_CLI_UI_LANGUAGE=en dotnet test --solution LeaveManager.slnx -c Release --no-build --filter-trait "Category=Integration" --ignore-exit-code 8 2>&1); rc=$?; printf "%s\n" "$out"; [ $rc -eq 0 ] || exit $rc; printf "%s\n" "$out" | grep -Eq "^ +total: [1-9]" || { echo "backend-integration: no tests ran"; exit 1; }'
#
# --- Frontend (React + Vite, Node 24) ---
frontend-install [fast]: npm ci --prefix src/frontend --no-audit --no-fund
frontend-lint [fast]: npm run --prefix src/frontend lint
frontend-typecheck [fast]: npm run --prefix src/frontend typecheck
# resource hygiene: vitest --run (no watch mode), one forked worker (vite.config.ts)
frontend-test [fast]: npm run --prefix src/frontend test -- --run
frontend-build: npm run --prefix src/frontend build
#
# --- Dependencies (docs/security.md: no known High/Critical) ---
# dotnet list exits 0 even with findings, so the step greps the JSON for High/Critical itself.
# resource hygiene: no MSBuild node reuse (dotnet list otherwise leaves 5 MSBuild nodes running)
deps-audit: sh -c 'out=$(MSBUILDDISABLENODEREUSE=1 DOTNET_CLI_UI_LANGUAGE=en dotnet list LeaveManager.slnx package --vulnerable --include-transitive --format json 2>&1) || { printf "%s\n" "$out"; exit 1; }; if printf "%s\n" "$out" | grep -Eq "\"severity\": *\"(High|Critical)\""; then printf "%s\n" "$out"; exit 1; fi; echo "dotnet: no High/Critical vulnerable packages"' && npm audit --prefix src/frontend --audit-level=high
